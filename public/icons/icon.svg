<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1e3a8a" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Background Rounded App Icon -->
  <rect width="512" height="512" rx="128" fill="url(#tenGrad)" />
  
  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="12" stroke-dasharray="24 16" />

  <!-- Inner Shield / Card Base -->
  <g filter="url(#shadow)">
    <!-- Main Stylized Checkmark & Task Shape -->
    <path d="M150 266 L224 340 L368 186" fill="none" stroke="url(#checkGrad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Circular Sparkle Top Right -->
  <circle cx="390" cy="120" r="16" fill="#38bdf8" />
  <circle cx="415" cy="155" r="9" fill="#93c5fd" />
</svg>
